services:
  - type: web
    name: ai-sheet-music-editor
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "bash build.sh"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port ${PORT:-10000}"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
